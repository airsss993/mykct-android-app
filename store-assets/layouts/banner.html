<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Баннер README</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="black.css">
<style>
  /* Стиль "50 звёзд": фон сгенерирован (gen/banner-bg2-prompt.txt), титановые корпуса, стеклянная капсула */
  .banner { width: 2048px; height: 1000px; overflow: hidden; background: #03042C url(../assets/banner-bg.png) center / cover; }
  .banner .bear { z-index: 6; left: 108px; top: 110px; height: 240px; border-radius: 54px; border: 2px solid #FFFFFF33; box-shadow: 0 30px 90px #3B2BD0AA; }
  .banner h1 { left: 100px; top: 390px; font-size: 230px; letter-spacing: -10px; }
  .banner .sub { left: 108px; top: 640px; font-size: 46px; color: #C8C6DC; }
  /* капсула из стекла, как кнопка на stars-fan */
  .banner .pill { z-index: 6; left: 108px; top: 805px; display: flex; align-items: center; gap: 18px; padding: 24px 56px 26px; border-radius: 999px; color: #FFF; font-size: 38px; font-weight: 600;
    background: linear-gradient(160deg, #FFFFFF38, #FFFFFF10 60%); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
    border: 2px solid #FFFFFF55; box-shadow: inset 0 3px 0 #FFFFFFB0, inset 0 -2px 0 #FFFFFF20, 0 30px 80px #00000080; }
  .banner .pill span { opacity: .7; font-weight: 500; }
  .banner .pill svg { width: 40px; height: 40px; }
  /* корпус: светлый титан, блик на верхней грани */
  .banner .iphone { background: linear-gradient(180deg, #FFFFFF 0%, #E4E0FA 6%, #A6A1C2 20%, #6F6A8E 55%, #4A4766 100%);
    box-shadow: inset 0 0 0 2px #FFFFFF60, inset 0 3px 0 1px #FFFFFFD0, inset 0 0 0 5px #1A1640, 0 -10px 50px #8C7BFF55, 0 100px 140px #000000CC; }
  .banner .iphone-button { display: none; }
  .vignette { z-index: 9; inset: 0; pointer-events: none; background: radial-gradient(120% 110% at 55% 45%, transparent 60%, #00000099 100%); }
</style></head>
<body><main class="canvas black banner" style="--w:2048px;--h:1000px">
  <img class="bear" src="../assets/app-icon-1024.png" alt="">
  <h1>Мой<em>КЦТ</em></h1>
  <p class="sub">Расписание, посещаемость и оценки<br>Колледжа Цифровых Технологий</p>
  <div class="pill"><svg viewBox="0 0 24 24" fill="#FFF"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>версия 2.0<span>новый дизайн</span></div>

  <div class="iphone" style="--device-width:450px;left:1110px;top:200px;z-index:3;transform:perspective(3600px) rotateY(14deg) rotate(-9deg);--side:-1">
    <div class="iphone-bezel"><div class="iphone-screen"><img src="../src/15-schedule-week-light.png" alt=""><div class="dynamic-island"></div></div></div></div>
  <div class="iphone" style="--device-width:450px;left:1660px;top:210px;z-index:3;transform:perspective(3600px) rotateY(-14deg) rotate(9deg)">
    <div class="iphone-bezel"><div class="iphone-screen"><img src="../src/24-attendance-dark.png" alt=""><div class="dynamic-island"></div></div></div></div>
  <div class="iphone" style="--device-width:500px;left:1350px;top:100px;z-index:5;transform:perspective(3600px) rotateX(4deg)">
    <div class="iphone-bezel"><div class="iphone-screen"><img src="../src/26-schedule-week-black.png" alt=""><div class="dynamic-island"></div></div></div></div>
  <div class="vignette"></div>
</main></body></html>
